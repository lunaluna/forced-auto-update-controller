name: Release

on:
  push:
    tags:
      - '[0-9]*'      # 既存タグはすべて素の semver（1.7.0 等）
      - 'v[0-9]*'     # v 付きも一応受ける
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.9.0)'
        required: false

permissions:
  contents: write

jobs:
  verify-pot-version:
    # languages/forced-auto-update-controller.pot の Project-Id-Version は
    # 手動更新の現在バージョン表記だが、"Project-Id-Version: <製品名> <version>\n"
    # という .pot 特有の書式(ラベルと version の間に製品名、末尾に \n" が付く)
    # は verify-version composite action の抽出ロジック(単一クォート値 or
    # パターン直後の残り全部)では正しく切り出せないため、専用ステップで
    # チェックする(l2d-wp-github-update-lib 側の verify-version action は
    # 変更しない — 他の利用プラグインにも影響する変更のため対象外)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::タグを解決できませんでした(workflow_dispatch では tag 入力が必須です)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify .pot Project-Id-Version matches the release version
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          FILE="languages/forced-auto-update-controller.pot"
          POT_VERSION=$(grep -E '^"Project-Id-Version:' "$FILE" \
            | head -n1 | sed -E 's/.*[[:space:]]([0-9][0-9.]*)\\n"$/\1/')
          echo "$FILE Project-Id-Version: $POT_VERSION"
          echo "Release version:                                  $VERSION"
          if [ "$POT_VERSION" != "$VERSION" ]; then
            echo "::error::$FILE の Project-Id-Version ($POT_VERSION) がリリースバージョン ($VERSION) と一致しません"
            exit 1
          fi

  tests:
    # release.yml はタグ push で発火し、CI (ci.yml) の成否には依存していない
    # (verify-pot-version は .pot のバージョン突合のみ)。テストが赤でも
    # タグを打てばリリースが出てしまうため、ci.yml の phpcs/phpstan/phpunit
    # 3 ジョブと同じセットアップでここでも実行し、機械的に止める。
    name: Tests (PHPCS / PHPStan / PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  release:
    needs: [ verify-pot-version, tests ]
    uses: lunaluna/l2d-wp-github-update-lib/.github/workflows/plugin-release.yml@1.1.0
    with:
      slug: forced-auto-update-controller
      version_files: |
        forced-auto-update-controller.php:^[[:space:]]*\*[[:space:]]*Version:
        readme.txt:^Stable tag:
      notes_source: readme.txt
