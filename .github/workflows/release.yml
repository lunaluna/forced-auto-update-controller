name: Release

on:
  push:
    tags:
      - '[0-9]*'      # 既存タグはすべて素の semver（1.7.0 等）
      - 'v[0-9]*'     # v 付きも一応受ける
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.9.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    uses: lunaluna/l2d-wp-github-update-lib/.github/workflows/plugin-release.yml@v1.0.2
    with:
      slug: forced-auto-update-controller
      version_files: |
        forced-auto-update-controller.php:^[[:space:]]*\*[[:space:]]*Version:
        readme.txt:^Stable tag:
      notes_source: readme.txt
